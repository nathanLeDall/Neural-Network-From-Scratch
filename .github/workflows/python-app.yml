name: Python Matrix Run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  run-script:
    name: Run Python script with matrix configs
    runs-on: ubuntu-latest

    strategy:
      matrix:
        config: [
          "configs/config_1.json",
        ]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run script with config
        run: |
          echo "Running with configuration: ${{ matrix.config }}"
          python main.py --config ${{ matrix.config }}

      - name: Upload output and logs
        if: always()
        run: |
            # sanitize matrix config name by replacing slashes with underscores
            ARTIFACT_NAME=$(echo "${{ matrix.config }}" | tr '/' '_')
            echo "Uploading artifact: $ARTIFACT_NAME"
            gh actions upload-artifact \
                --name "$ARTIFACT_NAME" \
                --path logs/ output/ *.log *.txt results/
